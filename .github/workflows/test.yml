name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vendored:
    name: vendored herdr_api copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare every plugin's copy with the first one
        run: |
          set -eu
          plugins=$(dirname */herdr-plugin.toml)
          first=$(echo "$plugins" | head -n1)
          for plugin in $plugins; do
            for file in herdr_api.py test_herdr_api.py; do
              cmp "$first/$file" "$plugin/$file"
            done
          done

  unittest:
    name: unittest (${{ matrix.os }}, ${{ matrix.setup || 'system python' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The plugins must run on the system Python of macOS (3.9).
          - os: macos-14
            python: /usr/bin/python3
          # Herdr runs the first python3 on its PATH, often a newer one from Homebrew or python.org.
          - os: macos-latest
            setup: "3.13"
            python: python3
          - os: macos-latest
            setup: "3.14"
            python: python3
          - os: ubuntu-latest
            python: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.setup
        with:
          python-version: ${{ matrix.setup }}
      - name: Run each plugin's tests from its own folder
        run: |
          set -eu
          ${{ matrix.python }} --version
          for manifest in */herdr-plugin.toml; do
            plugin=$(dirname "$manifest")
            echo "::group::$plugin"
            (cd "$plugin" && ${{ matrix.python }} -m unittest -v)
            echo "::endgroup::"
          done
      # The release helper runs on whatever python3 a maintainer has: the 3.9 run covers its
      # fallback TOML parser, the Ubuntu run covers tomllib.
      - name: Run the project skills' tests
        run: |
          set -eu
          for scripts in .claude/skills/*/scripts; do
            [ -d "$scripts" ] || continue
            echo "::group::$scripts"
            (cd "$scripts" && ${{ matrix.python }} -m unittest -v)
            echo "::endgroup::"
          done
      # The site's build and its playground, which must sort and colour like Space Herder (the
      # parity test runs herd.js under the runner's node).
      - name: Run the site's tests
        run: |
          set -eu
          (cd site && ${{ matrix.python }} -m unittest -v)
      # Companions' shell scripts (herdr-jump/install.sh) must run on macOS's /bin/sh; with the
      # system commands stubbed, the tests also run on Ubuntu's dash.
      - name: Run each companion's shell tests
        run: |
          set -eu
          for test in */tests/test_*.sh; do
            [ -f "$test" ] || continue
            echo "::group::$test"
            sh "$test"
            echo "::endgroup::"
          done

  # Companions (folders without herdr-plugin.toml) written in Lua: their pure modules run under
  # plain Lua 5.4, the version Hammerspoon embeds.
  lua:
    name: lua companions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Run each companion's tests
        run: |
          set -eu
          lua5.4 -v
          for runner in */tests/run.lua; do
            [ -f "$runner" ] || continue
            echo "::group::$runner"
            lua5.4 "$runner"
            echo "::endgroup::"
          done
