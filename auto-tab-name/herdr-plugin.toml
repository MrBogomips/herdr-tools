id = "mrbogomips.auto-tab-name"
name = "Auto Tab Name"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Name each tab after the folder of its pane (folder, repo, path or branch), keep it in sync as you move around, and leave alone the tabs you name yourself."
platforms = ["macos", "linux"]

[[actions]]
id = "sync"
title = "Sync tab names"
description = "Name every followed tab after the folder of its pane now, even with auto sync off."
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "auto_tab_name.py", "sync"]
