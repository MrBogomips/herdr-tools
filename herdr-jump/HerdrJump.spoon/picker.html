<!doctype html>
<!-- The agents picker, drawn by panel.lua in an hs.webview. picker.inline() puts the model
     (picker.model()) in the script below, and init.lua calls render(model) when the list changes
     while it is open.
     Messages to Hammerspoon go through the "herdrJump" port: jump, close, order, review.
     The arrows move over every row; with ⌥ over top-level rows, with ⇧ over the waiting ones.
     The bookmark after a title marks the agent to review, moves the mark to the next color, or
     clears it after the last: a click on it, or on the selected row Space (while the filter is
     empty) or ⌘R. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: rgba(242, 242, 244, 0.98);
    --fg: #1d1d1f;
    --dim: #6e6e73;
    --sel: rgba(0, 0, 0, 0.08);
    --line: rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgba(38, 38, 40, 0.98);
      --fg: #f2f2f4;
      --dim: #9a9aa0;
      --sel: rgba(255, 255, 255, 0.11);
      --line: rgba(255, 255, 255, 0.12);
    }
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--fg); cursor: default; -webkit-user-select: none; }
  .box { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  input { box-sizing: border-box; height: 56px; flex: none; padding: 0 18px; border: 0; outline: 0;
    border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: 22px -apple-system, sans-serif; }
  input::placeholder { color: var(--dim); }
  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .row { box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 7px; }
  .row.sel { background: var(--sel); }
  .icon { flex: none; width: 24px; height: 24px; }
  .text { flex: 1; min-width: 0; }
  .title, .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .sub { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .key { flex: none; color: var(--dim); font-size: 15px; }
  .row.child { height: 24px; padding-left: 48px; gap: 8px; }
  .row.child .icon { width: 13px; height: 13px; }
  .row.child .text { display: flex; align-items: baseline; gap: 8px; }
  .row.child .title { flex: none; max-width: 55%; font-size: 13px; }
  .row.child .sub { flex: 1; margin: 0; font-size: 11px; }
  .row.child .key { font-size: 12px; }
  .title .name { overflow: hidden; text-overflow: ellipsis; }
  .mark { flex: none; display: inline-flex; width: 18px; height: 18px; border-radius: 4px;
    align-items: center; justify-content: center; cursor: pointer; }
  .mark svg { width: 13px; height: 15px; }
  .mark:hover { background: var(--line); }
  .row.child .mark { width: 14px; height: 14px; }
  .row.child .mark svg { width: 10px; height: 12px; }
  .act { flex: none; color: var(--dim); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .row.child .act { font-size: 10.5px; padding: 0 5px; }
  footer .bm { display: inline-flex; vertical-align: -2px; }
  footer .bm svg { width: 7px; height: 9px; }
  footer { box-sizing: border-box; height: 30px; flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); white-space: nowrap; }
  footer .parts { display: flex; gap: 10px; }
  footer .hint { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 14px 12px; color: var(--dim); }
</style>
</head>
<body>
<div class="box">
  <input id="filter" autofocus spellcheck="false" autocomplete="off">
  <div id="list"></div>
  <footer><span class="parts" id="legend"></span><span class="hint" id="hint"></span></footer>
</div>
<script id="nav">
// The arrow keys' navigation, kept apart from the page so that tests/test_picker_js.sh runs it
// under node: the index of the next row after `from` in direction `step` (+1 or -1) that the mode
// stops on ("top": top-level rows; "waiting": rows that wait; anything else: every row), or `from`
// when there is none that way. Nothing selected (-1) stays so.
function nextIndex(rows, from, step, mode) {
  if (from < 0) return from;
  const stops = {
    top: (row) => row.depth === 0,
    waiting: (row) => row.waits === true,
  }[mode] || (() => true);
  for (let at = from + step; at >= 0 && at < rows.length; at += step) {
    if (stops(rows[at])) return at;
  }
  return from;
}

// What the bookmark of a row does, with `count` mark colors: "to review" marks an unmarked row in
// the first color, "next color" moves a marked one on, "reviewed" clears it from the last color.
function reviewAction(row, count) {
  const mark = row.mark || 0;
  if (mark === 0) return "to review";
  return mark < count ? "next color" : "reviewed";
}

// Whether a keydown marks the selected row: ⌘R always; Space alone while the filter is empty
// (with text in it, Space types a space, which a multi-word filter needs).
function isReviewKey(event, filterText) {
  if (event.metaKey && !event.ctrlKey && !event.altKey && event.key.toLowerCase() === "r") return true;
  const bare = !event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey;
  return bare && event.key === " " && filterText.trim() === "";
}

// The key the chip of the selected row names: the one that marks it now.
function reviewKeyLabel(filterText) {
  return filterText.trim() === "" ? "␣" : "⌘R";
}
</script>
<script>
let model = __MODEL__;
let visible = [];
let selected = null;
const filter = document.getElementById("filter");
const list = document.getElementById("list");

function send(message) {
  const port = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.herdrJump;
  if (port) port.postMessage(message);
}

// The status icons, drawn like the menu's (icon.lua): a filled disc waits for the user.
function icon(status) {
  const c = model.colors[status] || model.colors.unknown;
  const shapes = {
    blocked: `<circle cx="10" cy="10" r="9" fill="${c}"/><rect x="6.4" y="5.5" width="2.5" height="9" rx="0.8" fill="#fff"/><rect x="11.1" y="5.5" width="2.5" height="9" rx="0.8" fill="#fff"/>`,
    done: `<circle cx="10" cy="10" r="9" fill="${c}"/><path d="M5.6 10.4l3 3 5.8-6.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`,
    unknown: `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="1.8"/><text x="10" y="14" text-anchor="middle" font-size="11" font-weight="700" font-family="-apple-system" fill="${c}">?</text>`,
    idle: `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="1.8"/>`,
    working: `<circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="1.8"/><path d="M10 2a8 8 0 0 1 0 16z" fill="${c}"/>`,
  };
  return `<svg class="icon" viewBox="0 0 20 20">${shapes[status] || shapes.unknown}</svg>`;
}

// The bookmark: filled in mark color `mark` (1 to the number of colors), an outline for 0.
function bookmark(mark) {
  const c = mark > 0 ? model.markColors[mark - 1] : null;
  const stroke = c || "var(--dim)";
  return `<svg viewBox="0 0 12 15"><path d="M1.5 1.5h9v12L6 10.2 1.5 13.5z" fill="${c || "none"}" ` +
    `stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

const TIPS = {
  "to review": "To review (Space or ⌘R)", "next color": "Next color (Space or ⌘R)", reviewed: "Reviewed (Space or ⌘R)",
};

// The bookmark after a title, a button that marks, changes the color or clears.
function markButton(row) {
  const tip = TIPS[reviewAction(row, model.markColors.length)];
  return `<span class="mark" title="${tip}">${bookmark(row.mark || 0)}</span>`;
}

// On the selected row, what ⌘R does there.
function reviewChip(row) {
  const action = row.pane === selected && reviewAction(row, model.markColors.length);
  return action ? `<span class="act">${reviewKeyLabel(filter.value)} ${action}</span>` : "";
}

function review(pane) {
  if (visible.some((r) => r.pane === pane)) send({ action: "review", pane: pane });
}

function escape(text) {
  return String(text == null ? "" : text).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
}

// The status and its age in the status color, then the rest of the subtext.
function subText(row) {
  const rest = (row.sub || "").slice(row.when.length);
  return `<span style="color:${model.colors[row.status] || "inherit"}">${escape(row.when)}</span>${escape(rest)}`;
}

function render(next) {
  if (next) model = next;
  filter.placeholder = model.placeholder;
  const query = filter.value.trim().toLowerCase();
  visible = model.rows.filter((r) => !query || (r.title + " " + r.sub).toLowerCase().includes(query));
  if (!visible.some((r) => r.pane === selected)) {
    const first = visible.find((r) => r.key) || visible[0];
    selected = first ? first.pane : null;
  }
  list.innerHTML = visible.length ? visible.map((r) =>
    `<div class="row${r.depth > 0 ? " child" : ""}${r.pane === selected ? " sel" : ""}" data-pane="${escape(r.pane)}">` +
    icon(r.status) +
    `<div class="text"><div class="title"><span class="name">${escape(r.title)}</span>${markButton(r)}</div>` +
    `<div class="sub">${subText(r)}</div></div>` +
    reviewChip(r) + (r.key ? `<span class="key">⌘${r.key}</span>` : "") + `</div>`).join("")
    : `<div class="empty">No matching agents</div>`;
  document.getElementById("legend").innerHTML = model.legend.parts.map((p) => p.status === "mark"
    ? `<span>${model.markColors.map((_, i) => `<span class="bm">${bookmark(i + 1)}</span>`).join("")} ${escape(p.meaning)}</span>`
    : `<span><span style="color:${model.colors[p.status]}">${escape(p.glyph)}</span> ${escape(p.meaning)}</span>`).join("");
  document.getElementById("hint").textContent = model.legend.hint;
  const row = list.querySelector(".sel");
  if (row) row.scrollIntoView({ block: "nearest" });
}

function move(step, mode) {
  const next = nextIndex(visible, visible.findIndex((r) => r.pane === selected), step, mode);
  if (next < 0 || visible[next].pane === selected) return;
  selected = visible[next].pane;
  render();
}

// The navigation mode of an arrow key's modifiers: none, ⌥ alone or ⇧ alone; null for the others,
// which keep the field's own behaviour.
function arrowMode(event) {
  if (event.metaKey || event.ctrlKey || (event.altKey && event.shiftKey)) return null;
  return event.altKey ? "top" : event.shiftKey ? "waiting" : "all";
}

function jump(pane) {
  if (pane) send({ action: "jump", pane: pane });
}

filter.addEventListener("input", () => { selected = null; render(); });
document.addEventListener("keydown", (event) => {
  if (event.metaKey && /^[1-9]$/.test(event.key)) {
    const row = visible.find((r) => r.key === Number(event.key));
    if (row) jump(row.pane);
    event.preventDefault();
    return;
  }
  // ⌘R is always taken, so that it never reloads the page; Space only while the filter is empty.
  const reviewKey = isReviewKey(event, filter.value);
  if (reviewKey || (event.metaKey && event.key.toLowerCase() === "r")) {
    event.preventDefault();
    if (reviewKey && selected) review(selected);
    return;
  }
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    const mode = arrowMode(event);
    if (mode) {
      event.preventDefault();
      move(event.key === "ArrowDown" ? 1 : -1, mode);
    }
    return;
  }
  const actions = {
    Enter: () => jump(selected),
    Escape: () => send({ action: "close" }),
    Tab: () => send({ action: "order" }),
  };
  if (actions[event.key]) {
    event.preventDefault();
    actions[event.key]();
  }
});
list.addEventListener("click", (event) => {
  const row = event.target.closest(".row");
  if (row && event.target.closest(".mark")) {
    review(row.dataset.pane);
    return;
  }
  if (row) jump(row.dataset.pane);
});
list.addEventListener("mousemove", (event) => {
  const row = event.target.closest(".row");
  if (row && row.dataset.pane !== selected) {
    selected = row.dataset.pane;
    render();
  }
});
window.addEventListener("focus", () => filter.focus());
render();
filter.focus();
// init.lua holds its updates until this page, not the one the view showed before, can take them.
send({ action: "ready" });
</script>
</body>
</html>
